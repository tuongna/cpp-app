name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-ui/package-lock.json

      - name: Install WebView build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake --version || brew install cmake

      - name: Build UI + native core
        run: ./build.sh Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteamClone-${{ matrix.os }}
          path: |
            build/SteamClone
            build/SteamClone.app
            build/ui
          if-no-files-found: ignore
