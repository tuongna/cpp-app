name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-ui/package-lock.json

      - name: Install WebView build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake --version || brew install cmake

      - name: Build UI + native core
        shell: bash
        run: ./build.sh Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf SteamClone-linux.tar.gz -C build SteamClone ui

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: zip -r SteamClone-mac.zip build/SteamClone.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/SteamClone.exe, build/Release/ui `
            -DestinationPath SteamClone-windows.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteamClone-${{ matrix.os }}
          path: |
            SteamClone-linux.tar.gz
            SteamClone-mac.zip
            SteamClone-windows.zip
          if-no-files-found: ignore

  nightly:
    name: Nightly release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ github.sha }})"
          prerelease: true
          files: |
            artifacts/SteamClone-linux.tar.gz
            artifacts/SteamClone-mac.zip
            artifacts/SteamClone-windows.zip

  stable:
    name: Stable release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/SteamClone-linux.tar.gz
            artifacts/SteamClone-mac.zip
            artifacts/SteamClone-windows.zip
